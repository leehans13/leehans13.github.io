      <nav class="site-nav" aria-label="Primary navigation">

    <div class="wrapper">
      <h1>Gallery</h1>
      <p class="muted">A few moments outside research.</p>

      <div class="gallery-grid">
        <figure class="gallery-item">
          <img src="/assets/media/happy-days.jpg" alt="Hanshin Lee standing in a garden of orange flowers" loading="lazy">

          <video controls playsinline preload="metadata" poster="/assets/media/playing-tennis-poster.jpg">

            Your browser does not support the video element.
          </video>
          <figcaption>Playing tennis</figcaption>
